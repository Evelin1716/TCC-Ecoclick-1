<!DOCTYPE html>
<html lang="pt-BR" data-eco-page="login" data-eco-route="login">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar — EcoClick</title>
<meta name="description" content="EcoClick: encontre pontos de coleta de eletrônicos, agende descartes, cumpra missões e acompanhe seu impacto ambiental.">
<link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/themes.css">
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/page-context.js"></script>
<script src="../js/main.js"></script>
<script src="../js/components/form-fix.js"></script>
<script src="../js/components/fx.js"></script>
<script src="../js/pages/login/02-theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/pages/login/03-login.css">
</head>
<body>
<div class="page">
  <section class="left">
    <div class="top">
      <a class="logo" href="#" data-eco-nav="home" aria-label="EcoClick"><img class="eco-logo eco-logo-light" src="../assets/images/login-a253eadfa9.png" alt="EcoClick"><img class="eco-logo eco-logo-dark" src="../assets/images/login-0659191392.png" alt="" aria-hidden="true"></a>
      <a class="back" href="#" data-eco-nav="home"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Voltar</a>
    </div>

    <div class="center"><div class="box">
      <h1 id="h">Bem-vindo de volta!</h1>
      <p class="sub" id="s">Simplifique seu descarte e aumente seu impacto com o <strong>EcoClick</strong>. Comece grátis.</p>

      <form class="form active" data-form="login" novalidate>
        <div class="inp"><input id="login-email" type="email" placeholder="E-mail" aria-label="E-mail" autocomplete="email"></div>
        <div class="inp"><input id="login-pass" type="password" placeholder="Senha" aria-label="Senha" autocomplete="current-password">
          <button type="button" class="eye" aria-label="Mostrar senha" data-eye="login-pass"><svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <a href="#" class="forgot" data-forgot>Esqueceu a senha?</a>
        <p class="msg"></p>
        <button type="submit" class="btn">Entrar</button>
      </form>

      <form class="form" data-form="signup" novalidate>
        <div class="inp"><input id="signup-name" type="text" placeholder="Nome completo" aria-label="Nome completo" autocomplete="name"></div>
        <div class="inp"><input id="signup-email" type="email" placeholder="E-mail" aria-label="E-mail" autocomplete="email"></div>
        <div class="inp"><input id="signup-pass" type="password" placeholder="Crie uma senha" aria-label="Senha" autocomplete="new-password">
          <button type="button" class="eye" aria-label="Mostrar senha" data-eye="signup-pass"><svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <label class="consent"><input type="checkbox" id="signup-consent"><span>Li e aceito os <a href="#" data-policy="termos">Termos de uso</a> e a <a href="#" data-policy="privacidade">Política de Privacidade</a>.</span></label>
        <p class="msg"></p>
        <button type="submit" class="btn" style="margin-top:8px">Criar conta</button>
      </form>

      <div class="or"><span>ou continue com</span></div>
      <div class="social">
        <button type="button" data-social="Google" aria-label="Continuar com Google"><svg viewBox="0 0 24 24"><path d="M21.35 11.1H12v2.98h5.35c-.5 2.4-2.5 3.6-5.35 3.6a5.8 5.8 0 0 1 0-11.6c1.4 0 2.6.5 3.5 1.3l2.2-2.2A9 9 0 1 0 12 21c5.2 0 8.7-3.6 8.7-8.8 0-.4 0-.7-.1-1.1z"/></svg></button>
        <button type="button" data-social="Apple" aria-label="Continuar com Apple"><svg viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.5 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9s-2-.9-3.2-.8A4.8 4.8 0 0 0 4 9.5c-1.7 3-.4 7.400 1.200 9.800.8 1.200 1.800 2.500 3 2.400 1.200 0 1.700-.8 3.100-.8s1.900.8 3.200.7c1.300 0 2.100-1.200 2.900-2.300a10 10 0 0 0 1.300-2.700 4.200 4.200 0 0 1-2.300-3.900zM14.100 5.300A4.200 4.200 0 0 0 15 2.300a4.300 4.300 0 0 0-2.800 1.500 4 4 0 0 0-1 3c1.100.1 2.100-.5 2.900-1.500z"/></svg></button>
        <button type="button" data-social="Facebook" aria-label="Continuar com Facebook"><svg viewBox="0 0 24 24"><path d="M13.5 21v-8h2.700l.4-3.200h-3.100V7.800c0-.9.3-1.500 1.600-1.500h1.700V3.400c-.3 0-1.300-.1-2.400-.1-2.400 0-4 1.400-4 4.100v2.400H7.700V13h2.700v8z"/></svg></button>
      </div>

      <p class="swap" id="sw-login">Ainda não é membro? <button type="button" data-to="signup">Criar conta</button></p>
      <p class="swap" id="sw-signup" style="display:none">Já tem uma conta? <button type="button" data-to="login">Entrar</button></p>
    </div></div>
  </section>

</div>

<script src="../js/pages/login/04-auth-forms.js"></script>
</body>
</html>
