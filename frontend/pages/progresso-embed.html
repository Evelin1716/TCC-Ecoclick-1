<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="../js/components/embed-nav.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu progresso — EcoClick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/pages/progress/02-progresso.css">
<link rel="stylesheet" href="../css/pages/progress/03-palette.css"><link rel="stylesheet" href="../css/pages/progress/04-embed.css"></head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M12 3a5 5 0 00-5 5v3l-1.5 3h13L17 11V8a5 5 0 00-5-5zM9.5 19a2.5 2.5 0 005 0"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 17l5-5-5-5M20 12H9M13 21H6a2 2 0 01-2-2V5a2 2 0 012-2h7"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M12 21c-4.5-1-7-4.8-7-9.5C5 7 8 4 12 3c4 1 7 4 7 8.5 0 4.7-2.5 8.5-7 9.5zM12 21V9"/></symbol>
  <symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 3l-6 8h3l-4 6h14l-4-6h3zM12 17v4"/></symbol>
  <symbol id="i-recycle" viewBox="0 0 24 24"><path d="M20 12a8 8 0 01-14 5.3M4 12a8 8 0 0114-5.3M18 3v4h-4M6 21v-4h4"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6.5 8-6.5s8 2.5 8 6.5"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 110-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 100-5C13 2 12 7 12 7z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 20h20"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></symbol>
  <symbol id="i-headset" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></symbol>
</svg>

<div class="backdrop" id="backdrop"></div>
<div class="shell">

  <!-- ===== BARRA LATERAL (o site hospedeiro pode manter sua própria; "Meu progresso" é a opção principal) ===== -->
  <aside class="side" id="side">
    <div class="logo" aria-label="EcoClick"><img class="eco-logo-side" src="../assets/images/progress-0659191392.png" alt="EcoClick"></div>
    <div class="tag" data-i="hero_tag"></div>
    <a href="#" data-eco-nav="dashboard"><svg class="ic"><use href="#i-home"/></svg><span data-i="nav_home"></span></a>
    <a href="#progress" data-go="progress" class="on"><svg class="ic"><use href="#i-trend"/></svg><span data-i="nav_progress"></span></a>
    <a href="#" data-eco-nav="missions"><svg class="ic"><use href="#i-leaf"/></svg><span data-i="nav_missions"></span></a>
    <a href="#" class="eco-out" id="ecoOut"><svg class="ic"><use href="#i-logout"/></svg><span data-i="logout"></span></a>
  </aside>

  <div class="main">
    <!-- ===== BARRA SUPERIOR ===== -->
    <header class="top">
      <button class="sq burger" id="burger" data-ia="menu_toggle" aria-label="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div class="grow"></div>
      <div class="pill"><svg class="flame f-sm" viewBox="30 30 330 450" aria-hidden="true" focusable="false"><path d="M155 38C160 98 128 150 86 205C56 245 38 275 38 305C38 385 92 445 152 470C108 432 92 360 122 300C142 264 164 246 183 238C166 290 186 332 205 370C212 384 210 390 205 395C224 384 238 358 248 330C276 376 276 430 225 470C300 450 352 400 352 330C352 272 330 218 292 183C282 214 274 246 250 258C256 188 226 96 155 38Z"/></svg><span id="streakTop"></span></div>
      <div class="bellwrap">
        <button class="sq" id="bellBtn" data-ia="notif" aria-haspopup="true" aria-expanded="false"><svg class="ic"><use href="#i-bell"/></svg><i class="dot" id="bellDot"></i></button>
        <div class="npanel" id="npanel" role="dialog">
          <div class="nph"><div><h3 data-i="notif"></h3><div class="nsub" id="nSub"></div></div><button class="nlink" id="markAll"></button></div>
          <div class="nlist" id="nlist"></div>
          <div class="nnote" data-i="notif_note"></div>
        </div>
      </div>
      <button class="me" id="meBtn" data-go="profile">
        <div class="av" id="avTop"></div>
        <span class="tx"><strong id="meName"></strong><small id="meLvl"></small></span>
      </button>
    </header>

    <!-- ===== MEU PROGRESSO ===== -->
    <section class="view on" id="v-progress">
      <div class="hi"><h1 id="hello"></h1><p data-i="hello_sub"></p></div>

      <div class="grid g-hero">
        <div class="hero">
          <div class="t">
            <span class="chip" data-i="hero_tag"></span>
            <h2><span data-i="hero_title"></span><svg class="flame f-lg" viewBox="30 30 330 450" aria-hidden="true" focusable="false"><path d="M155 38C160 98 128 150 86 205C56 245 38 275 38 305C38 385 92 445 152 470C108 432 92 360 122 300C142 264 164 246 183 238C166 290 186 332 205 370C212 384 210 390 205 395C224 384 238 358 248 330C276 376 276 430 225 470C300 450 352 400 352 330C352 272 330 218 292 183C282 214 274 246 250 258C256 188 226 96 155 38Z"/></svg></h2>
            <p data-i="hero_text"></p>
            <div class="acts">
              <button class="btn b1" id="toChart" data-i="btn_chart"></button>
            </div>
          </div>
          <svg class="art" viewBox="0 0 250 250" aria-hidden="true">
            <circle cx="125" cy="130" r="100" fill="var(--card)" opacity=".55"/>
            <circle cx="205" cy="55" r="30" fill="#84cfb0" opacity=".5"/>
            <g transform="translate(78 62)"><rect width="88" height="140" rx="16" fill="#1d4a38"/><rect x="8" y="12" width="72" height="104" rx="8" fill="#84cfb0"/><circle cx="44" cy="128" r="5" fill="#84cfb0"/>
              <g transform="translate(44 64)" stroke="#1d4a38" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 0a20 20 0 01-35 13M-20 0a20 20 0 0135-13M17 -22v9h-9M-17 22v-9h9"/></g></g>
            <path d="M40 80c18-4 30 6 30 22-18 4-30-6-30-22z" fill="#4a8476"/><path d="M200 175c-16-8-34-2-38 14 16 8 34 2 38-14z" fill="#4a8476"/><path d="M52 190c12-10 26-6 30 6-12 8-26 4-30-6z" fill="#84cfb0"/>
          </svg>
        </div>
      </div>

      <div class="lvs" id="levels">
        <div class="lvs-head">
          <div><div class="eyebrow" data-i="lv_eyebrow"></div><h2 data-i="lv_title"></h2></div>
          <div class="car-nav"><button class="sq" id="lvPrev" data-ia="prev"><svg class="ic"><path d="M15 6l-6 6 6 6"/></svg></button><button class="sq" id="lvNext" data-ia="next"><svg class="ic"><path d="M9 6l6 6-6 6"/></svg></button></div>
        </div>
        <div class="car" id="lvCar"><div class="car-track" id="lvTrack"></div></div>
        <div class="car-dots" id="lvDots"></div>
      </div>

      <div class="grid g-3">
        <div class="card stat">
          <div class="ico"><svg class="ic"><use href="#i-recycle"/></svg></div>
          <h3 data-i="goal_title"></h3>
          <div class="big"><span id="goalN">0</span><small data-i="goal_items"></small></div>
          <div class="trk"><i id="goalBar" data-w="0%"></i></div>
          <p data-i="goal_left"></p>
        </div>
        <div class="card stat">
          <div class="ico"><svg class="ic"><use href="#i-tree"/></svg></div>
          <h3 data-i="trees_title"></h3>
          <div class="big" id="trees"></div>
          <p data-i="trees_text"></p>
        </div>
        <div class="card stat">
          <div class="ico"><svg class="flame f-md" viewBox="30 30 330 450" aria-hidden="true" focusable="false"><path d="M155 38C160 98 128 150 86 205C56 245 38 275 38 305C38 385 92 445 152 470C108 432 92 360 122 300C142 264 164 246 183 238C166 290 186 332 205 370C212 384 210 390 205 395C224 384 238 358 248 330C276 376 276 430 225 470C300 450 352 400 352 330C352 272 330 218 292 183C282 214 274 246 250 258C256 188 226 96 155 38Z"/></svg></div>
          <h3 data-i="streak_title"></h3>
          <div class="big" id="streakBig"></div>
          <div class="flames"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
          <p data-i="streak_text"></p>
        </div>
      </div>

      <div class="grid g-chart" id="chartSec">
        <div class="card">
          <div class="ch-head">
            <div><div class="eyebrow" data-i="chart_sub"></div><h2 data-i="chart_title"></h2></div>
            <div class="seg" id="seg"><button class="on" data-m="bars" data-i="bars"></button><button data-m="line" data-i="line"></button></div>
          </div>
          <div class="cwrap"><div id="chart"></div><div class="tip" id="tip"></div></div>
          <div class="growth"><span data-i="growth"></span></div>
          <div class="hint" data-i="hint"></div>
        </div>
        <div class="card detail">
          <div class="eyebrow" data-i="sel_month"></div>
          <h2 id="dMonth"></h2>
          <div class="dv"><span id="dVal"></span><small data-i="items_unit"></small></div>
          <div><span class="delta" id="dDelta"></span></div>
          <div class="row"><span data-i="of_total"></span><span id="dShare"></span></div>
          <div class="bar"><i id="dBar"></i></div>
        </div>
      </div>

      <div class="lvs mos" id="months">
        <div class="lvs-head">
          <div><h2 data-i="mo_title"></h2></div>
          <div class="car-nav"><button class="sq" id="moPrev" data-ia="prev"><svg class="ic"><path d="M15 6l-6 6 6 6"/></svg></button><button class="sq" id="moNext" data-ia="next"><svg class="ic"><path d="M9 6l6 6-6 6"/></svg></button></div>
        </div>
        <div class="car" id="moCar"><div class="car-track" id="moTrack"></div></div>
        <div class="car-dots" id="moDots"></div>
      </div>
    </section>

    <!-- ===== PERFIL ===== -->
    <section class="view" id="v-profile">
      <div class="card" style="margin-bottom:20px">
        <div class="phead">
          <div class="avl"><div class="av" id="avBig"></div>
            <label for="file" data-ia="photo" role="button"><svg class="ic"><use href="#i-camera"/></svg></label>
            <input type="file" id="file" accept="image/*" hidden></div>
          <div style="flex:1;min-width:200px">
            <h1 id="pName"></h1>
            <div style="margin-top:8px"><span class="st" data-i="active"></span><span style="color:var(--muted);font-size:0.78rem;font-weight:700" data-i="since"></span></div>
            <div class="pact"><label class="btn b2 sm" for="file" id="photoBtn"></label><button class="btn b2 sm" id="rmPhoto" data-i="photo_rm"></button></div>
          </div>
          <button class="btn b1" id="editAll" data-i="edit_all"></button>
        </div>
      </div>

      <div class="grid g-2">
        <div class="card">
          <div class="eyebrow" data-i="personal"></div><h2 data-i="personal"></h2>
          <div id="fields"></div>
        </div>
        <div class="card">
          <div class="eyebrow" data-i="security"></div><h2 data-i="security"></h2>
          <div class="row2"><div><div class="v" data-i="pw_t"></div><small data-i="pw_d"></small></div><button class="btn b2 sm" id="pwBtn" data-i="pw_btn"></button></div>
          <div class="row2"><div><div class="v" data-i="tfa_t"></div><small data-i="tfa_d"></small></div><label class="sw"><input type="checkbox" data-pref="tfa"><span></span></label></div>
          <div class="ok" id="prot"></div>
        </div>
      </div>

      <div class="grid g-2">
        <div class="card">
          <div class="eyebrow" data-i="settings"></div><h2 data-i="settings"></h2>
          <div class="sub" data-i="appearance"></div>
          <div class="row2"><div class="v"><span data-i="theme"></span></div>
            <div class="seg" id="themeSeg"><button data-t="light"><span data-i="theme_l"></span></button><button data-t="dark"><span data-i="theme_d"></span></button></div></div>
          <div class="row2"><div class="v"><svg class="ic" style="vertical-align:-4px"><use href="#i-globe"/></svg> <span data-i="lang"></span></div>
            <div class="seg" id="langSeg"><button data-l="pt">Português</button><button data-l="es">Español</button><button data-l="en">English</button></div></div>
          <div class="sub" data-i="notif"></div>
          <div class="row2"><span class="v" data-i="n1"></span><label class="sw"><input type="checkbox" data-pref="n1"><span></span></label></div>
          <div class="row2"><span class="v" data-i="n2"></span><label class="sw"><input type="checkbox" data-pref="n2"><span></span></label></div>
          <div class="row2"><span class="v" data-i="n3"></span><label class="sw"><input type="checkbox" data-pref="n3"><span></span></label></div>
          <div class="row2"><span class="v" data-i="n4"></span><label class="sw"><input type="checkbox" data-pref="n4"><span></span></label></div>
          <div class="sub" data-i="privacy"></div>
          <div class="row2"><span class="v" data-i="p1"></span><label class="sw"><input type="checkbox" data-pref="p1"><span></span></label></div>
          <div class="row2"><span class="v" data-i="p2"></span><label class="sw"><input type="checkbox" data-pref="p2"><span></span></label></div>
          <div class="row2"><span class="v" data-i="p3"></span><label class="sw"><input type="checkbox" data-pref="p3"><span></span></label></div>
        </div>
        <div class="card">
          <div class="eyebrow" data-i="history"></div><h2 data-i="history"></h2>
          <div class="tl" id="hList"></div>
          <button class="btn b2 sm" id="moreBtn" style="margin-top:14px"></button>
          <div class="hint" data-i="hist_note"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="ov" id="ov"><div class="modal"><h3 id="mT"></h3><div id="mB"></div><div class="err" id="mE"></div>
  <div class="macts"><button class="btn b2" id="mC"></button><button class="btn b1" id="mS"></button></div></div></div>
<div class="toast" id="toast"></div>

<script src="../js/pages/progress/05-progresso.js"></script>
<script src="../js/pages/progress/06-altura-iframe.js"></script><script src="../js/pages/progress/07-logout.js"></script></body>
</html>
